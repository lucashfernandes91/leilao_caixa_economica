{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
	<h2>Lista de Registros</h2>
	<table class="table table-striped">
		<thead>
			<tr>
				<th>ID</th>
				<th>Nome</th>
				<th>Descrição</th>
				<th>Data de Criação</th>
				<th>Preço</th>
				<th>Contrato</th>
			</tr>
		</thead>
		<tbody>
			{% for item in list_items %}
			<tr>
				<td>{{ item.numLot }}</td>
				<td>{{ item.contractLot }}</td>
				<td>{{ item.descriptionLot }}</td>
				<td>{{ item.priceLot }}</td>
			</tr>
			{% empty %}
			<tr>
				<td colspan="6">Nenhum registro encontrado.</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>
</div>
{% endblock %}
